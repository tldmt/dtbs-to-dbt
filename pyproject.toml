[project]
name = "databricks-api"
version = "0.1.0"
description = "A tool to consume data from Databricks API"
readme = "README.md"
authors = [
    { name = "tldmt", email = "" }
]
requires-python = ">=3.14"
dependencies = [
    "databricks-sdk>=0.156.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
